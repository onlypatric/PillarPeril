name: Build & Test

on:
  push:
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew clean test shadowJar --no-daemon

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pillarperil-jar
          path: build/libs/*.jar

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build plugin
        run: ./gradlew clean shadowJar --no-daemon

      - name: Prepare Paper server
        run: |
          mkdir -p integration-server/plugins
          curl -L https://api.papermc.io/v2/projects/paper/versions/1.21.1/builds/86/downloads/paper-1.21.1-86.jar -o integration-server/paper.jar
          echo "eula=true" > integration-server/eula.txt
          cat > integration-server/server.properties <<'PROPS'
          online-mode=false
          enable-command-block=true
          max-players=5
          view-distance=4
          motd=PillarPeril Integration Test
          PROPS
          cp build/libs/*.jar integration-server/plugins/

      - name: Start Paper server
        run: |
          cd integration-server
          java -Xmx1G -jar paper.jar --nogui > server.log 2>&1 & echo $! > ../server.pid
          for i in {1..40}; do
            if grep -qi "Done (" server.log; then echo "Server ready"; exit 0; fi
            sleep 3
          done
          echo "Server did not start in time" && cat server.log && exit 1

      - name: Install bot dependencies
        run: |
          cd scripts/integration
          npm install mineflayer

      - name: Run integration bot
        run: |
          cd integration-server
          node ../scripts/integration/mineflayer-bot.js

      - name: Stop Paper server
        if: always()
        run: |
          if [ -f server.pid ]; then kill $(cat server.pid) || true; fi
          if [ -f integration-server/server.log ]; then cat integration-server/server.log; fi
